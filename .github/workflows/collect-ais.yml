name: Collect VesselAPI
on:
  schedule:
    - cron: '21,51 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/update-ais.test.mjs scripts/reserve-ais.test.mjs scripts/ais-areas.test.mjs
      - name: Reserve request using area and verified quota
        id: budget
        if: github.run_attempt == 1
        run: node scripts/reserve-ais.mjs
      - name: Fetch terrestrial position
        id: fetch
        if: steps.budget.outputs.allowed == 'true'
        continue-on-error: true
        env:
          VESSELAPI_API_KEY: ${{ secrets.VESSELAPI_API_KEY }}
        run: node scripts/update-ais.mjs
      - name: Persist data and source health
        if: steps.budget.outputs.allowed == 'true'
        run: |
          node scripts/validate-data.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/latest.json site/data/ais-health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update AIS observation and collection health'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Mark publication needed
        if: steps.budget.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ais-collected
          path: site/data/ais-health.json
          retention-days: 2
      - name: Surface collection failure
        if: steps.fetch.outcome == 'failure'
        run: exit 1

