name: Collect VesselAPI
on:
  schedule:
    - cron: '26,56 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Collection moved to Cloudflare Cron. This job has NO provider key.
      - run: node scripts/mirror-ais.mjs
      - run: node scripts/validate-data.mjs
      - name: Publish cached observations only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/latest.json site/data/ais-health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Mirror central AIS observations and health'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ais-collected
          path: site/data/ais-health.json
          retention-days: 2
