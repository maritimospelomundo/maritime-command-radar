name: Deploy Maritime Master Radar

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "21 3,9,15,21 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test VesselAPI integration
        run: node --test scripts/update-ais.test.mjs
      # Only this scheduled job calls VesselAPI: four cron slots per day.
      # Email updates, manual deploys and reruns never consume API credits.
      - name: Fetch Abdias terrestrial AIS position
        continue-on-error: true
        if: github.event_name == 'schedule' && github.run_attempt == 1 && github.ref == 'refs/heads/main'
        env:
          VESSELAPI_API_KEY: ${{ secrets.VESSELAPI_API_KEY }}
        run: node scripts/update-ais.mjs
      - name: Validate public data
        run: node scripts/validate-data.mjs
      - name: Test command summary
        run: node --test scripts/command-summary.test.mjs
      - name: Build reusable command summary
        run: node scripts/build-command-summary.mjs
      - name: Persist VesselAPI position for every portal
        if: github.event_name == 'schedule' && github.run_attempt == 1 && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Abdias VesselAPI position'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          node scripts/validate-data.mjs
          node scripts/build-command-summary.mjs
      - name: Build public portals
        working-directory: public-portals
        env:
          VITE_PORTALS_API: https://abdias-public-portals.maritimospelomundo.workers.dev
        run: |
          npm ci
          npm test
          npm run build
          mkdir -p ../site/abdias
          cp -R dist/. ../site/abdias/
      - name: Disable Jekyll
        run: touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
