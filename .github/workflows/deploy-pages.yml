name: Deploy Maritime Master Radar

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect VesselAPI']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            if (context.eventName !== 'workflow_run') return true;
            const result = await github.rest.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: context.payload.workflow_run.id});
            return result.data.artifacts.some(a => a.name === 'ais-collected' && !a.expired);
  build:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && ( github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test VesselAPI integration
        run: node --test scripts/update-ais.test.mjs scripts/reserve-ais.test.mjs
      - name: Validate public data
        run: node scripts/validate-data.mjs
      - name: Test NAVAREA engine and failure preservation
        run: node --test scripts/navarea.test.mjs
      - name: Test command summary
        run: node --test scripts/command-summary.test.mjs
      - name: Build reusable command summary
        run: node scripts/build-command-summary.mjs
      - name: Build public portals
        working-directory: public-portals
        env:
          VITE_PORTALS_API: https://abdias-public-portals.maritimospelomundo.workers.dev
        run: |
          npm ci
          npm test
          npm run build
          mkdir -p ../site/abdias
          cp -R dist/. ../site/abdias/
      - name: Disable Jekyll
        run: touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
