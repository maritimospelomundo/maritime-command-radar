name: Deploy Abdias public portals API
on:
  push:
    branches: [main]
    paths: ['public-portals/**', '.github/workflows/deploy-public-portals.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: abdias-public-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-portals
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: public-portals/package-lock.json
      - run: npm ci
      - run: npx esbuild worker/index.ts --bundle --format=esm --platform=browser --outfile=/tmp/portals-worker.mjs
      - run: npm test
        env:
          PORTALS_WORKER_BUNDLE: /tmp/portals-worker.mjs
      - run: node worker/provision.mjs
      - run: npx wrangler d1 migrations apply abdias-public-portals --remote --config worker/wrangler.json
      - run: npx wrangler deploy --config worker/wrangler.json
      - name: Verify access protection
        run: |
          for path in position shore import; do
            for attempt in 1 2 3 4 5 6; do
              status=$(curl --max-time 15 --silent --output /dev/null --write-out '%{http_code}' "https://abdias-public-portals.maritimospelomundo.workers.dev/api/$path")
              test "$status" = 401 && break
              echo "Waiting for endpoint $path (HTTP $status)"
              sleep 5
            done
            test "$status" = 401 || exit 1
          done
